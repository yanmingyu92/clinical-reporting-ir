# Bridge-Map Sample (synthetic, anonymized)
# ----------------------------------------------------------------------------
# Illustrates the structure of the legacy bridge map described in Section
# 3.3.1 of the manuscript. Each entry binds one legacy SAS macro entry point to its
# native counterpart and declares the parameter-name mapping used by the
# parity harness's LegacyDriver to build a driver program.
#
# All macro names, file names, and identifiers below are SYNTHETIC and generic
# (e.g. %legacy_ae_summary). No organization-specific macro names, internal
# paths, or proprietary parameter names appear here. The entry structure
# (fields, layering, dependency list) mirrors the production bridge map.
#
# Field reference:
#   report_type_id        Unique key the harness/native side uses for the report.
#   legacy_macro          Autocall macro invocation (with leading %).
#   legacy_autocall_path  SASAUTOS search location for the macro.
#   legacy_file           Source file that defines the macro.
#   legacy_location       Logical library area (root | adam | submacros).
#   layer                 Architecture layer (data_layer | utility | compute | report).
#   report_type           Report family, where applicable (else null).
#   native_target         Identifier of the native pipeline component.
#   parameter_mapping     canonical (native) parameter name -> legacy macro keyword.
#   dependencies          Other legacy macros invoked internally (advisory).
#   post_calls            Optional follow-up macro invocations (multi-section reports).
#   status                bridge_auto | bridge_curated | retired.
#   notes                 Free text.

schema_version: 1
